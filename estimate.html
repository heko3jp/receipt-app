<!DOCTYPE html>
<html lang="ja">

<meta name="theme-color" content="#14213d" />
<title>その場で概算見積</title>
<style>

  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }

  header.top h1 { font-size: 20px; letter-spacing: .02em; }
  header.top span { font-size: 12px; color: var(--sub); }

  label.f { display: block; font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  label.f input, label.f textarea, label.f select { display: block; width: 100%; margin-top: 4px; }
  input, textarea, select { background: #fff; border: 1px solid #c7cdd8; border-radius: 10px; padding: 10px 12px; font-size: 16px; min-height: 44px; color: var(--ink); }
  select { width: 100%; max-width: 100%; text-overflow: ellipsis; }
  textarea { min-height: 88px; resize: vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #c7cdd8; background: #fff; font-weight: 600; cursor: pointer; padding: 10px 14px; text-align: center; }
  .btn.pri { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); font-size: 17px; }
  .btn.sm { min-height: 44px; width: auto; font-size: 14px; font-weight: 500; }

  .btn.danger { color: var(--bad); }

  .row > .grow { flex: 1; min-width: 0; }

  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .photos label.add { aspect-ratio: 1; border: 2px dashed #aeb6c5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; color: var(--sub); cursor: pointer; background: #fff; text-align: center; }

  .notice { background: var(--warn-bg); border: 1px solid #f1d39a; color: #6b4a06; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .error { background: #fef3f2; border: 1px solid #f3b6b0; color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; }

  .tag.ai { background: var(--warn-bg); color: var(--warn); }
  .item { border-top: 1px solid var(--line); padding: 12px 0; }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item .name { width: 100%; font-weight: 600; }
  .item .nums { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px minmax(0,56px) minmax(0,1.3fr); gap: 6px; margin-top: 6px; align-items: center; }

  .present .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; }

  @media print {
    body { background: #fff; }
    #app, nav.tabs, .present .bar { display: none !important; }
    .present { position: static; overflow: visible; }

</style>

<script>

    ['水回り', 'キッチン', '式', 16000], ['水回り', 'レンジフード', '台', 14000], ['水回り', '浴室', '式', 15000],

    ['室内', '床洗浄・ワックス', '㎡', 800], ['室内', '窓・サッシ', '枚', 1500], ['室内', '空室クリーニング（1K）', '式', 25000],
    ['その他', '出張費', '式', 2000], ['その他', '駐車場代', '式', 1000],
  ]},

// ---------- 保存 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('est_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('est_' + k, JSON.stringify(v)); return true; } catch { return false; } },
};
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let settings = Object.assign(
  { apiKey: '', company: '', staff: '', industry: '', taxRate: 10, validDays: 30, footer: '本書は写真と聞き取りに基づく概算です。正式なお見積りは現物確認のうえご提示します。' },
  store.get('settings', {})
);
// 同じ場所に置いたレシート読取アプリのAPIキーがあれば引き継ぐ
if (!settings.apiKey) { try { settings.apiKey = localStorage.getItem('anthropic_key') || ''; } catch {} }
let priceList = store.get('prices', []);   // {id, cat, name, unit, price}
let estimates = store.get('estimates', []); // 見積もり履歴

const newDraft = () => ({
  id: uid('e'), createdAt: Date.now(), customer: '', title: '', memo: '',
  items: [], summary: '', assumptions: '', unknowns: [], confidence: '', rangePct: 0, discount: 0, thumbs: [],
});
const S = { tab: 'new', step: 'capture', draft: newDraft(), photos: [], busy: '', err: '', presenting: false, saveWarn: false };

// ---------- 小道具 ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = (n) => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const num = (v) => { const n = parseFloat(String(v).replace(/[,，¥\s]/g, '')); return Number.isFinite(n) ? n : 0; };
const fmtDate = (t) => { const d = new Date(t); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
const qtyStr = (q) => (Math.round(q * 100) / 100).toLocaleString('ja-JP');

function calc(d) {
  const subtotal = d.items.reduce((s, it) => s + Math.round(num(it.qty) * num(it.price)), 0);
  const discount = Math.min(Math.max(num(d.discount), 0), subtotal);
  const taxable = subtotal - discount;
  const tax = Math.floor(taxable * num(settings.taxRate) / 100);
  const total = taxable + tax;
  const p = num(d.rangePct) / 100;
  const low = Math.floor(total * (1 - p) / 1000) * 1000;
  const high = Math.ceil(total * (1 + p) / 1000) * 1000;
  return { subtotal, discount, taxable, tax, total, low, high, hasRange: p > 0 && total > 0 };
}

function saveDraft() {
  const d = S.draft;
  const i = estimates.findIndex((e) => e.id === d.id);
  const copy = JSON.parse(JSON.stringify(d));
  if (i >= 0) estimates[i] = copy; else estimates.unshift(copy);
  S.saveWarn = !store.set('estimates', estimates);
}

// ---------- 画像 ----------
const readDataUrl = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('ファイルを読み込めませんでした')); r.readAsDataURL(file); });

function scaleImage(file, maxEdge, quality) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('この画像形式は読み込めませんでした（JPEG / PNG でお試しください）')); };
    img.src = url;
  });
}

async function addPhotos(files) {
  S.err = '';
  for (const f of files) {
    if (S.photos.length >= MAX_PHOTOS) { S.err = `写真は${MAX_PHOTOS}枚までです`; break; }
    try {
      const full = await scaleImage(f, 1568, 0.82);
      const thumb = await scaleImage(f, 220, 0.6);
      S.photos.push({ full, thumb });
    } catch (e) { S.err = e.message; }
  }
  render();
}

// ---------- AI 呼び出し ----------
async function callClaude({ system, content, schema }) {
  if (!settings.apiKey) throw new Error('APIキーが未登録です。「設定」タブで登録してください。');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 180000);
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: ctl.signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': settings.apiKey,
        'anthropic-version': '2026-10-21',
        'anthropic-beta': 'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 16000,
        fallbacks: 'default',
        system,
        output_config: { effort: 'medium', format: { type: 'json_schema', schema } },
        messages: [{ role: 'user', content }],
      }),
    });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? '応答に時間がかかりすぎました。電波の良い場所で、写真を減らしてもう一度お試しください。' : '通信できませんでした。電波状況を確認してください。');
  } finally { clearTimeout(timer); }

  if (!res.ok) {
    let msg = '';
    try { msg = (await res.json())?.error?.message || ''; } catch {}
    if (res.status === 401) throw new Error('APIキーが正しくありません。「設定」タブで確認してください。');
    if (res.status === 429) throw new Error('利用が集中しています。少し待ってからもう一度お試しください。');
    if (res.status >= 500) throw new Error('AIサービスが混み合っています。少し待ってからもう一度お試しください。');
    throw new Error('AIの呼び出しに失敗しました（' + res.status + '）' + (msg ? '\n' + msg : ''));
  }
  const data = await res.json();
  if (data.stop_reason === 'refusal') throw new Error('この写真・内容ではAIが見積もりを作成できませんでした。手入力で作成してください。');
  if (data.stop_reason === 'max_tokens') throw new Error('AIの回答が長すぎて途中で切れました。写真やメモを絞ってもう一度お試しください。');
  const text = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('');
  try { return JSON.parse(text); } catch { throw new Error('AIの回答を読み取れませんでした。もう一度お試しください。'); }
}

const ESTIMATE_SCHEMA = {
  type: 'object', additionalProperties: false,
  required: ['summary', 'items', 'assumptions', 'unknowns', 'confidence'],

    summary: { type: 'string', description: '写真から読み取れた現場の状況（2〜3文）' },

      properties: {
        price_id: { type: 'string', description: '単価表のID。単価表にない項目は空文字' },
        name: { type: 'string' }, unit: { type: 'string' },
        qty: { type: 'number' },
        unit_price: { type: 'number', description: '税抜単価（円）。単価表の項目は表の単価' },
        basis: { type: 'string', description: 'この数量にした根拠（1文）' },
      } } },
    assumptions: { type: 'array', items: { type: 'string' }, description: 'お客様に示す前提条件' },
    unknowns: { type: 'array', items: { type: 'string' }, description: '写真では分からず、現地で担当者が確認すべき点' },
    confidence: { type: 'string', enum: ['high', 'medium', 'low'] },
  },
};

const ESTIMATE_SYSTEM = `あなたは日本の現場系サービス業（自動車の鈑金塗装・工事・回収・清掃など）の積算担当者です。担当者がお客様先でスマホ撮影した写真とメモから、その場で提示する概算見積もりの明細案を作ります。金額の計算はアプリ側が行うので、あなたの仕事は「どの項目が、どれだけの数量必要か」を拾い出すことです。

進め方:
- 明細は、渡された単価表の項目から選ぶのが基本です。選んだ項目は price_id に単価表のIDを入れ、name・unit・unit_price は表のとおりにします。数量はその項目の単位で出してください。
- 作業に必要なのに単価表にない項目があれば、price_id を空文字にして追加し、日本国内の一般的な相場から税抜単価を入れてください。アプリ上で「AI推定単価」と表示され、担当者が確認します。
- 数量は写真に写っているもの（ドアや窓、畳、人、家電などの寸法の目安になるもの）とメモから見積もります。メモに寸法や数量が書かれていれば、写真からの推定よりメモを優先します。面積や長さは計算過程が分かるように basis に書いてください（例：「幅3.6m×奥行2.7m×高さ2.4mの壁4面から開口部を除き約26㎡」）。
- 出張費・養生・処分費など、その作業に通常伴う諸経費が単価表にあれば含めます。写真やメモから必要性が読み取れない項目は入れません。
- 写っていない範囲、裏側、下地の状態など、写真では判断できないことは推測で埋めずに unknowns に書きます。これは担当者がその場でお客様に確認するためのリストです。
- assumptions は見積書に印字されお客様が読みます。「写真に写っている範囲のみを対象」のように、金額が変わりうる条件を平易な言葉で書いてください。
- confidence は、数量の確からしさです。寸法の手がかりが十分なら high、目測中心なら medium、写真が不鮮明・範囲が不明なら low にします。
- 写真が見積もり対象と関係ない、または何も判断できない場合は、items を空にして summary にその旨を書いてください。

自動車の損傷写真の場合:
- まず損傷しているパネル・部品を特定し（例：左リアドア、リアバンパー左角）、それぞれについてキズ・へこみ・割れ・塗装剥がれの種類と大きさを見ます。大きさは、ドアハンドル・給油口・ホイール・ナンバープレートなど寸法の分かる部品と比べて判断し、basis に書いてください。
- パネルごとに、鈑金で直すか交換かを判断し、鈑金の大きさ区分、そのパネルの塗装、作業に必要な脱着（バンパー、ランプ、内張りなど）を拾います。プレスラインや縁にかかるへこみ、樹脂部品の割れ、パネルの大きな変形は、補修か交換かで金額が大きく変わるので、どちらを前提にしたかを assumptions に書きます。
- 色合わせのために隣のパネルへぼかし塗装が必要になりそうな場合（メタリック・パールで、損傷がパネルの端に近いときなど）は、ぼかし塗装を入れます。ボディ色がパールや3コートに見えるときは、単価表に加算項目があれば塗装するパネル数ぶん入れます。写真で色の種類を判断しきれないときは unknowns に書きます。
- 交換部品の部品代は車種・年式・グレードで変わり、写真からは分かりません。メモに金額がなければ部品代の行は作らず、「〇〇の部品代は別途」と assumptions に書いてください。
- 内部の骨格やセンサー・カメラ・レーダー類の損傷、パネルの裏側、足回りへの影響は外観写真では分かりません。損傷の位置からその可能性があるときは unknowns に挙げます。
- 車種・ボディ色・年式がメモにあればそれを使い、なければ写真から分かる範囲で summary に書きます。`;

const IMPORT_SCHEMA = {
  type: 'object', additionalProperties: false, required: ['items'],
  properties: { items: { type: 'array', items: {
    type: 'object', additionalProperties: false, required: ['category', 'name', 'unit', 'unit_price'],
    properties: { category: { type: 'string' }, name: { type: 'string' }, unit: { type: 'string' }, unit_price: { type: 'number' } },
  } } },
};

async function runAI() {
  const d = S.draft;
  if (!S.photos.length) { S.err = '写真を1枚以上追加してください'; return render(); }
  S.err = ''; S.busy = '写真を解析して見積もりを作成しています…\n30秒〜1分ほどかかります'; render();
  try {
    const list = priceList.map((p) => `${p.id} | ${p.cat} | ${p.name} | ${p.unit} | ${p.price}`).join('\n');
    const content = S.photos.map((p) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.full.split(',')[1] } }));
    content.push({ type: 'text', text:
      `業種: ${settings.industry || '（未設定）'}\n件名: ${d.title || '（未入力）'}\n担当者メモ: ${d.memo || '（なし）'}\n\n` +
      `単価表（ID | カテゴリ | 項目 | 単位 | 税抜単価 円）:\n${list || '（未登録。すべて相場から推定してください）'}` });
    const r = await callClaude({ system: ESTIMATE_SYSTEM, content, schema: ESTIMATE_SCHEMA });
    d.items = (r.items || []).filter((it) => num(it.qty) > 0).map((it) => {
      const p = priceList.find((x) => x.id === it.price_id);
      return p
        ? { name: p.name, unit: p.unit, price: p.price, qty: num(it.qty), src: 'list', basis: it.basis || '' }
        : { name: it.name, unit: it.unit, price: Math.round(num(it.unit_price)), qty: num(it.qty), src: 'ai', basis: it.basis || '' };
    });
    d.summary = r.summary || '';
    d.assumptions = (r.assumptions || []).join('\n');
    d.unknowns = r.unknowns || [];
    d.confidence = r.confidence || 'medium';
    d.rangePct = { high: 10, medium: 20, low: 30 }[d.confidence] || 20;
    d.thumbs = S.photos.map((p) => p.thumb);
    S.step = 'edit';
    saveDraft();
  } catch (e) { S.err = e.message; }
  S.busy = ''; render(); window.scrollTo(0, 0);
}

async function importPrices(file) {
  S.err = ''; S.busy = '見積書から単価を読み取っています…'; render();
  try {
    let block;
    if (file.type === 'application/pdf') {
      block = { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: (await readDataUrl(file)).split(',')[1] } };
    } else {
      block = { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: (await scaleImage(file, 2000, 0.85)).split(',')[1] } };
    }
    const r = await callClaude({
      system: 'あなたは見積書から単価表を作る事務担当者です。渡された過去の見積書・料金表から、今後の見積もりに再利用できる明細項目を抜き出します。項目名・単位・税抜単価は書かれているとおりに写し、書かれていない単価を推測で補わないでください。小計・合計・消費税・値引きの行は項目ではないので含めません。category には内容から判断した短い分類名（例：鈑金、塗装、脱着・交換、部品、諸経費）を入れます。',
      content: [block, { type: 'text', text: 'この書類から単価表の項目を抜き出してください。' }],
      schema: IMPORT_SCHEMA,
    });
    const added = (r.items || []).filter((it) => it.name && num(it.unit_price) > 0)
      .map((it) => ({ id: uid('p'), cat: it.category || 'その他', name: it.name, unit: it.unit || '式', price: Math.round(num(it.unit_price)) }));
    if (!added.length) throw new Error('単価を読み取れる項目が見つかりませんでした。');
    priceList = priceList.concat(added); store.set('prices', priceList);
    S.info = `${added.length}件の項目を追加しました。内容を確認してください。`;
  } catch (e) { S.err = e.message; }
  S.busy = ''; render();
}

const isCar = () => settings.industry === PRESETS.bankin.label;

function loadPreset(key) {

}

function groupBy(list) {
  const m = new Map();
  for (const p of list) { if (!m.has(p.cat)) m.set(p.cat, []); m.get(p.cat).push(p); }
  return [...m.entries()];
}

    </div>
    <div class="card">
      <label class="f">Anthropic APIキー<input data-s="apiKey" type="password" value="${esc(settings.apiKey)}" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <p class="muted">キーはこの端末のブラウザ内にだけ保存され、AIの呼び出し時にAnthropicへ直接送られます。写真の解析1回ごとにAPI利用料がかかります。端末を他人と共用する場合は登録しないでください。</p>
    </div>
    <p class="muted">見積もり・単価表・設定はすべてこの端末に保存されます。ブラウザの閲覧データを消去すると失われます。</p>`;
}

function viewPresent() {
  const d = S.draft, c = calc(d);
  const valid = new Date(d.createdAt + num(settings.validDays) * 86400000);
  const conds = d.assumptions.split('\n').map((s) => s.trim()).filter(Boolean);
  return `<div class="present" role="dialog" aria-label="概算見積書"><div class="in">
    <div class="doc"><span>${fmtDate(d.createdAt)}</span><span style="text-align:right">${esc(settings.company)}${settings.staff ? '<br>担当：' + esc(settings.staff) : ''}</span></div>
    <h1>概算御見積書</h1>
    <div class="to">${esc(d.customer || '　　　　　')} 様</div>
    ${d.title ? `<div>件名：${esc(d.title)}</div>` : ''}
    <div class="big">
      <small>概算お見積り金額（税込）</small>
      <strong>${yen(c.total)}</strong>
      ${c.hasRange ? `<div class="range">現地の状況により ${yen(c.low)} 〜 ${yen(c.high)}</div>` : ''}
    </div>
    <table>
      <thead><tr><th>項目</th><th>数量</th><th>単価</th><th>金額</th></tr></thead>
      <tbody>${d.items.map((it) => `<tr><td>${esc(it.name)}</td><td>${qtyStr(num(it.qty))}${esc(it.unit)}</td><td>${yen(num(it.price))}</td><td>${yen(Math.round(num(it.qty) * num(it.price)))}</td></tr>`).join('')}</tbody>
    </table>
    <div class="totals sum">
      <div><span>小計</span><span>${yen(c.subtotal)}</span></div>
      ${c.discount ? `<div><span>値引き</span><span>−${yen(c.discount)}</span></div>` : ''}
      <div><span>消費税（${esc(settings.taxRate)}%）</span><span>${yen(c.tax)}</span></div>
      <div class="grand" style="font-size:18px"><span>合計</span><span>${yen(c.total)}</span></div>
    </div>
    <div class="cond">
      ${conds.length ? `<h3>前提条件</h3><ul class="plain" style="font-size:13px">${conds.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <p style="margin-top:8px">有効期限：${fmtDate(valid)}</p>
      <p>${esc(settings.footer)}</p>
    </div>
    <div class="bar">
      <button class="btn" data-act="close-present">編集に戻る</button>
      <button class="btn" data-act="share">共有</button>
      <button class="btn pri" style="font-size:16px" data-act="print">印刷 / PDF</button>
    </div>
  </div></div>`;
}

const TABS = [['new', '新規'], ['history', '履歴'], ['prices', '単価表'], ['settings', '設定']];
function render() {
  const views = { new: viewNew, history: viewHistory, prices: viewPrices, settings: viewSettings };
  document.getElementById('app').innerHTML =
    `<header class="top"><h1>その場で概算見積</h1><span>${esc(settings.company)}</span></header>` + views[S.tab]();
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) =>
    `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${l}${k === 'history' && estimates.length ? `（${estimates.length}）` : ''}</button>`).join('');
  document.getElementById('overlay').innerHTML =
    (S.presenting ? viewPresent() : '') +
    (S.busy ? `<div class="busy" role="status"><div class="spin"></div><p style="white-space:pre-line">${esc(S.busy)}</p></div>` : '');
}

function shareText() {
  const d = S.draft, c = calc(d);
  return [
    `【概算御見積】${d.customer ? d.customer + ' 様' : ''}`, d.title ? `件名：${d.title}` : '',
    ...d.items.map((it) => `・${it.name} ${qtyStr(num(it.qty))}${it.unit} × ${yen(num(it.price))} = ${yen(Math.round(num(it.qty) * num(it.price)))}`),
    c.discount ? `値引き −${yen(c.discount)}` : '',
    `合計（税込）${yen(c.total)}`, c.hasRange ? `概算幅 ${yen(c.low)} 〜 ${yen(c.high)}` : '',
    settings.footer, settings.company,
  ].filter(Boolean).join('\n');
}

// ---------- イベント ----------
document.addEventListener('click', async (ev) => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; S.err = ''; S.info = ''; render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const d = S.draft, i = +el.dataset.i, id = el.dataset.id;
  switch (el.dataset.act) {
    case 'preset': loadPreset(el.dataset.key); break;
    case 'skip-preset': store.set('skipPreset', true); break;
    case 'rm-photo': S.photos.splice(i, 1); break;
    case 'ai': return runAI();
    case 'manual': d.thumbs = S.photos.map((p) => p.thumb); S.step = 'edit'; S.err = ''; saveDraft(); break;
    case 'back': S.step = 'capture'; break;
    case 'new':
      if (!confirm('新しい見積もりを始めますか？（現在の内容は履歴に保存されています）')) return;
      S.draft = newDraft(); S.photos = []; S.step = 'capture'; S.err = ''; break;
    case 'inc': d.items[i].qty = Math.round((num(d.items[i].qty) + 1) * 100) / 100; saveDraft(); break;
    case 'dec': d.items[i].qty = Math.max(0, Math.round((num(d.items[i].qty) - 1) * 100) / 100); saveDraft(); break;
    case 'rm-item': d.items.splice(i, 1); saveDraft(); break;
    case 'add-free': d.items.push({ name: '', unit: '式', price: 0, qty: 1, src: 'free', basis: '' }); saveDraft(); break;
    case 'present': saveDraft(); S.presenting = true; break;
    case 'close-present': S.presenting = false; break;
    case 'print': window.print(); return;
    case 'share': {
      const text = shareText();
      try {
        if (navigator.share) await navigator.share({ title: '概算御見積', text });
        else { await navigator.clipboard.writeText(text); alert('見積もり内容をコピーしました'); }
      } catch (e) { if (e.name !== 'AbortError') alert('共有できませんでした'); }
      return;
    }
    case 'open': {
      const e = estimates.find((x) => x.id === id); if (!e) return;
      S.draft = JSON.parse(JSON.stringify(e)); S.photos = []; S.step = 'edit'; S.tab = 'new'; break;
    }
    case 'rm-est':
      if (!confirm('この見積もりを削除しますか？')) return;
      estimates = estimates.filter((x) => x.id !== id); store.set('estimates', estimates);
      if (S.draft.id === id) { S.draft = newDraft(); S.photos = []; S.step = 'capture'; }
      break;
    case 'rm-price': priceList = priceList.filter((p) => p.id !== id); store.set('prices', priceList); break;
    case 'add-price': priceList.push({ id: uid('p'), cat: el.dataset.cat, name: '', unit: '式', price: 0 }); store.set('prices', priceList); break;
    case 'add-cat': {
      const name = (prompt('カテゴリ名を入力してください') || '').trim(); if (!name) return;
      priceList.push({ id: uid('p'), cat: name, name: '', unit: '式', price: 0 }); store.set('prices', priceList); break;
    }
  }
  render();
});

// 入力中は再描画しない（フォーカスを保つ）。確定時（change）に保存・再計算する。
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.d && !('rerender' in t.dataset)) S.draft[t.dataset.d] = t.value;
  if (t.dataset.s) { settings[t.dataset.s] = t.value.trim(); store.set('settings', settings); }
});

document.addEventListener('change', (ev) => {
  const t = ev.target, d = S.draft;
  if (t.dataset.file === 'photo') { const fs = [...t.files]; t.value = ''; return addPhotos(fs); }
  if (t.dataset.file === 'import') { const f = t.files[0]; t.value = ''; if (f) importPrices(f); return; }
  if (t.dataset.it) {
    const it = d.items[+t.dataset.i], k = t.dataset.it;
    it[k] = (k === 'qty' || k === 'price') ? Math.max(0, num(t.value)) : t.value;
    if (k === 'price' && it.src === 'ai') it.src = 'free'; // 担当者が単価を確認・修正した
    saveDraft(); return render();
  }
  if (t.dataset.d) {
    d[t.dataset.d] = ('rerender' in t.dataset) ? num(t.value) : t.value;
    if (S.step === 'edit') saveDraft();
    if ('rerender' in t.dataset) render();
    return;
  }
  if (t.hasAttribute('data-add') && t.value) {
    const p = priceList.find((x) => x.id === t.value);
    if (p) { d.items.push({ name: p.name, unit: p.unit, price: p.price, qty: 1, src: 'list', basis: '' }); saveDraft(); }
    return render();
  }
  if (t.dataset.p) {
    const p = priceList.find((x) => x.id === t.dataset.id); if (!p) return;
    p[t.dataset.p] = t.dataset.p === 'price' ? Math.max(0, Math.round(num(t.value))) : t.value.trim();
    store.set('prices', priceList); return;
  }
  if (t.dataset.cat != null) {
    const name = t.value.trim() || t.dataset.cat;
    priceList.forEach((p) => { if (p.cat === t.dataset.cat) p.cat = name; });
    store.set('prices', priceList); return render();
  }
  if (t.hasAttribute('data-preset') && t.value) {
    if (confirm('現在の単価表をサンプルに置き換えますか？')) loadPreset(t.value);
    return render();
  }
  if (t.dataset.s) render();
});

render();
</script>
</body>
</html>
